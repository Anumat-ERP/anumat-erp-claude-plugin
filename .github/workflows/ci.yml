name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the scaffold resolves versions from npm, so it can break without a commit here.
    - cron: '0 3 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Marketplace and plugin structure
        run: node scripts/validate.mjs
      - name: Claude Code manifest checks and bundle install
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          for d in plugins/*/; do claude plugin validate --strict "$d"; done
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          claude plugin marketplace add "$PWD"
          claude plugin install anumat-erp-all@anumat-erp
          claude plugin list
      - name: monorepo-stack unit tests
        run: node plugins/monorepo-stack/scripts/test.mjs

  acceptance:
    # Generates a real workspace and runs install, build, type-check, lint and test in it.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: node plugins/monorepo-stack/scripts/acceptance.mjs
